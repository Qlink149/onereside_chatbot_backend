name: Backup deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"

jobs:
  Build:
    name: Setup Chatbot Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.branch }}

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Login to Vultr Container Registry
        run: |
          docker login -u ${{ secrets.VULTR_REGISTRY_USERNAME }} -p ${{ secrets.VULTR_REGISTRY_PASSWORD }} ${{ secrets.VULTR_REGISTRY_URL }}

      - name: Build and push Docker image
        run: |
          export DOCKER_BUILDKIT=1
          REGISTRY_PATH="sgp.vultrcr.com/qlink01/onereside_bot"
          docker build -t $REGISTRY_PATH:latest .
          docker push $REGISTRY_PATH:latest

      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }} 
          username: ${{ secrets.SERVER_USERNAME }} 
          password: ${{ secrets.SERVER_PASSWORD }} 
          script: |
            # Login to Vultr Container Registry
            docker login -u ${{ secrets.VULTR_REGISTRY_USERNAME }} -p ${{ secrets.VULTR_REGISTRY_PASSWORD }} ${{ secrets.VULTR_REGISTRY_URL }}

            # Pull the latest image
            docker pull sgp.vultrcr.com/qlink01/onereside_bot:latest

            # Stop and remove existing container if it exists
            docker stop qlink || true
            docker rm qlink || true

            # Run new container
            docker run -d \
              --name qlink \
              -p 8000:8000 \
              -e PYTHONUNBUFFERED=1 \
              -e PYTHONDONTWRITEBYTECODE=1 \
              -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
              -e MONGO_URI=${{ secrets.MONGO_URI }} \
              -e ENV_MODE=${{ secrets.ENV_MODE }} \
              -e GUPSHUP_APP_ID=${{ secrets.GUPSHUP_APP_ID }} \
              -e GUPSHUP_TOKEN=${{ secrets.GUPSHUP_TOKEN }} \
              -e GUPSHUP_APP_NAME=${{ secrets.GUPSHUP_APP_NAME }} \
              -e GUPSHUP_API_KEY=${{ secrets.GUPSHUP_API_KEY }} \
              -e CHROMA_API_KEY=${{ secrets.CHROMA_API_KEY }} \
              -e CHROMA_TENANT=${{ secrets.CHROMA_TENANT }} \
              -e RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }} \
              -e RAZORPAY_APP_ID=${{ secrets.RAZORPAY_APP_ID }} \
              -e RAZORPAY_APP_SECRETE=${{ secrets.RAZORPAY_APP_SECRETE }} \
              -e DASHBOARD_API_KEY=${{ secrets.DASHBOARD_API_KEY }} \
              -e R2_ACCESS_KEY=${{ secrets.R2_ACCESS_KEY }} \
              -e R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }} \
              -e R2_ENDPOINT=${{ secrets.R2_ENDPOINT }} \
              -e R2_BUCKET=${{ secrets.R2_BUCKET }} \
              -e R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }} \
              sgp.vultrcr.com/qlink01/onereside_bot

      - name: Cleanup Old Images
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}    
          username: ${{ secrets.SERVER_USERNAME }}   
          password: ${{ secrets.SERVER_PASSWORD }}   
          script: |
            # Remove dangling images to free up space
            docker image prune -f

